<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Rifa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-indigo-600 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
            <h1 class="text-2xl font-bold flex items-center gap-2"><i class="fa-solid fa-ticket"></i> Sorteo de Rifa</h1>
            <div class="flex items-center gap-3">
                <button onclick="cargarDatos()" class="bg-indigo-700 hover:bg-indigo-800 px-3 py-2 rounded-lg text-sm font-medium transition flex items-center gap-2">
                    <i class="fa-solid fa-rotate"></i> Actualizar
                </button>
                <button onclick="abrirAdminModal()" class="bg-slate-800 hover:bg-slate-900 px-3 py-2 rounded-lg text-sm font-medium transition flex items-center gap-2">
                    <i class="fa-solid fa-gear"></i> Admin / Config
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 py-6 flex-grow w-full space-y-6">

        <!-- Panel de Estadísticas -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                <p class="text-xs text-slate-500 font-semibold uppercase">Total Números</p>
                <p id="statTotal" class="text-2xl font-bold text-slate-800">-</p>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                <p class="text-xs text-emerald-600 font-semibold uppercase">Disponibles</p>
                <p id="statDisponibles" class="text-2xl font-bold text-emerald-600">-</p>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                <p class="text-xs text-rose-600 font-semibold uppercase">Vendidos</p>
                <p id="statVendidos" class="text-2xl font-bold text-rose-600">-</p>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                <p class="text-xs text-indigo-600 font-semibold uppercase">Recaudación Estimada</p>
                <p id="statRecaudacion" class="text-2xl font-bold text-indigo-600">$0</p>
            </div>
        </div>

        <!-- Barra de Búsqueda y Filtros -->
        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="relative w-full md:w-96">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                    <i class="fa-solid fa-search"></i>
                </span>
                <input type="text" id="buscador" oninput="filtrarRifas()" placeholder="Buscar por número o nombre..." class="w-full pl-10 pr-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
            </div>
            <div class="flex items-center gap-2 w-full md:w-auto">
                <button onclick="filtrarEstado('todos')" id="btnFiltroTodos" class="flex-1 md:flex-none px-4 py-2 bg-indigo-50 text-indigo-700 text-sm font-semibold rounded-lg transition">Todos</button>
                <button onclick="filtrarEstado('Disponible')" id="btnFiltroLibres" class="flex-1 md:flex-none px-4 py-2 bg-slate-100 text-slate-600 text-sm font-semibold rounded-lg transition">Libres</button>
                <button onclick="filtrarEstado('Vendido')" id="btnFiltroVendidos" class="flex-1 md:flex-none px-4 py-2 bg-slate-100 text-slate-600 text-sm font-semibold rounded-lg transition">Vendidos</button>
            </div>
        </div>

        <!-- Grid de Números -->
        <div id="gridRifas" class="grid grid-cols-5 sm:grid-cols-10 md:grid-cols-15 lg:grid-cols-20 gap-2">
            <!-- Se llena dinámicamente -->
        </div>

    </main>

    <!-- Loader -->
    <div id="loader" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex flex-col items-center justify-center z-50 text-white">
        <i class="fa-solid fa-spinner fa-spin text-4xl mb-2"></i>
        <p class="font-medium">Sincronizando con Google Sheets...</p>
    </div>

    <!-- Modal Venta / Detalle -->
    <div id="modalVenta" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-xl space-y-4">
            <div class="flex justify-between items-center border-b pb-3">
                <h3 id="modalTitulo" class="text-lg font-bold text-slate-800">Gestionar Número</h3>
                <button onclick="cerrarModalVenta()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <input type="hidden" id="modalNumero">
            <div>
                <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Estado</label>
                <select id="modalEstado" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500">
                    <option value="Disponible">Disponible</option>
                    <option value="Vendido">Vendido</option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Nombre del Comprador</label>
                <input type="text" id="modalComprador" placeholder="Ej. Juan Pérez" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Teléfono</label>
                <input type="text" id="modalTelefono" placeholder="Ej. 1123456789" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Notas / Observaciones</label>
                <input type="text" id="modalNotas" placeholder="Ej. Pagado por MercadoPago" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500">
            </div>
            <div class="flex justify-end gap-3 pt-3 border-t">
                <button onclick="cerrarModalVenta()" class="px-4 py-2 border border-slate-300 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-50">Cancelar</button>
                <button onclick="guardarVenta()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-sm font-medium shadow-sm">Guardar Cambios</button>
            </div>
        </div>
    </div>

    <!-- Modal Admin / Configuración -->
    <div id="modalAdmin" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-xl space-y-4">
            <div class="flex justify-between items-center border-b pb-3">
                <h3 class="text-lg font-bold text-slate-800">Panel de Administración</h3>
                <button onclick="cerrarAdminModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div id="adminLogin" class="space-y-4">
                <p class="text-sm text-slate-600">Ingresa la clave de administrador para modificar precios y configuración.</p>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Contraseña</label>
                    <input type="password" id="adminPass" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm" placeholder="••••••••">
                </div>
                <button onclick="verificarAdmin()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white p-2.5 rounded-lg text-sm font-medium">Ingresar</button>
            </div>
            <div id="adminPanel" class="space-y-4 hidden">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Cantidad Total de Números</label>
                    <input type="number" id="confTotal" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Precio Individual ($)</label>
                    <input type="number" id="confPrecio" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Promociones / Combos (JSON)</label>
                    <textarea id="confPromos" rows="3" class="w-full border border-slate-300 rounded-lg p-2.5 text-xs font-mono"></textarea>
                    <p class="text-xs text-slate-400 mt-1">Ej: [{"cantidad": 3, "precio": 5000}]</p>
                </div>
                <div class="flex justify-end gap-3 pt-3 border-t">
                    <button onclick="cerrarAdminModal()" class="px-4 py-2 border border-slate-300 rounded-lg text-sm font-medium text-slate-600">Cerrar</button>
                    <button onclick="guardarConfiguracion()" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg text-sm font-medium">Guardar Config</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Script de Integración -->
    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxQ46HVsvkf2A0hk_7Uei0VlTWm7_nQ_ERWbJHjuOyvGZWyymnSGj0iWJeHF-Qnt04U2Q/exec";
        
        let rifasData = [];
        let configData = { totalNumeros: 300, precioIndividual: 2000, promociones: [{ cantidad: 3, precio: 5000 }] };
        let filtroActual = 'todos';

        window.onload = function() {
            cargarDatos();
        };

        function cargarDatos() {
            document.getElementById('loader').classList.remove('hidden');
            fetch(WEB_APP_URL + "?action=getData")
                .then(res => res.json())
                .then(data => {
                    rifasData = data.rifas || [];
                    if(data.config) configData = data.config;
                    
                    // Si la planilla está vacía, generamos estructura inicial en memoria hasta el totalNumeros
                    if(rifasData.length === 0) {
                        for(let i=1; i<=configData.totalNumeros; i++) {
                            rifasData.push({numero: i, estado: 'Disponible', comprador: '', telefono: '', fecha: '', notas: ''});
                        }
                    }
                    
                    renderizarGrid();
                    actualizarEstadisticas();
                    document.getElementById('loader').classList.add('hidden');
                })
                .catch(err => {
                    console.error(err);
                    alert("Error al conectar con Google Sheets.");
                    document.getElementById('loader').classList.add('hidden');
                });
        }

        function renderizarGrid() {
            const grid = document.getElementById('gridRifas');
            grid.innerHTML = '';
            
            const busqueda = document.getElementById('buscador').value.toLowerCase();

            rifasData.forEach(item => {
                // Filtro por estado
                if(filtroActual === 'Disponible' && item.estado !== 'Disponible') return;
                if(filtroActual === 'Vendido' && item.estado !== 'Vendido') return;

                // Filtro por búsqueda
                if(busqueda && !item.numero.toString().includes(busqueda) && !(item.comprador && item.comprador.toLowerCase().includes(busqueda))) {
                    return;
                }

                const vendido = item.estado === 'Vendido';
                const div = document.createElement('div');
                div.className = `aspect-square rounded-lg flex flex-col items-center justify-center cursor-pointer font-bold text-sm transition transform hover:scale-105 shadow-sm border ${
                    vendido ? 'bg-rose-500 text-white border-rose-600' : 'bg-white text-emerald-700 border-emerald-300 hover:bg-emerald-50'
                }`;
                div.innerHTML = `
                    <span class="text-base">${item.numero}</span>
                    <span class="text-[9px] font-normal truncate max-w-[90%] px-1 opacity-90">${item.comprador || (vendido ? 'Vendido' : 'Libre')}</span>
                `;
                div.onclick = () => abrirModalVenta(item);
                grid.appendChild(div);
            });
        }

        function actualizarEstadisticas() {
            const total = configData.totalNumeros || rifasData.length;
            const vendidos = rifasData.filter(i => i.estado === 'Vendido').length;
            const disponibles = total - vendidos;

            document.getElementById('statTotal').innerText = total;
            document.getElementById('statVendidos').innerText = vendidos;
            document.getElementById('statDisponibles').innerText = disponibles;

            // Cálculo inteligente de recaudación aplicando promos
            let recaudacion = calcularRecaudacionTotal(vendidos);
            document.getElementById('statRecaudacion').innerText = '$' + recaudacion.toLocaleString('es-AR');
        }

        function calcularRecaudacionTotal(cantVendidos) {
            let precioInd = configData.precioIndividual || 2000;
            let promos = configData.promociones || [{ cantidad: 3, precio: 5000 }];
            
            // Ordenar promos de mayor a menor cantidad
            promos.sort((a,b) => b.cantidad - a.cantidad);

            let restante = cantVendidos;
            let total = 0;

            promos.forEach(p => {
                let paquetes = Math.floor(restante / p.cantidad);
                total += paquetes * p.precio;
                restante %= p.cantidad;
            });

            total += restante * precioInd;
            return total;
        }

        function filtrarEstado(estado) {
            filtroActual = estado;
            ['todos', 'Libres', 'Vendidos'].forEach(e => {
                const btn = document.getElementById('btnFiltro' + e);
                if(e.toLowerCase() === estado.toLowerCase() || (estado==='todos' && e==='todos')) {
                    btn.className = "flex-1 md:flex-none px-4 py-2 bg-indigo-50 text-indigo-700 text-sm font-semibold rounded-lg transition";
                } else {
                    btn.className = "flex-1 md:flex-none px-4 py-2 bg-slate-100 text-slate-600 text-sm font-semibold rounded-lg transition";
                }
            });
            renderizarGrid();
        }

        function filtrarRifas() {
            renderizarGrid();
        }

        function abrirModalVenta(item) {
            document.getElementById('modalNumero').value = item.numero;
            document.getElementById('modalTitulo').innerText = `Número #${item.numero}`;
            document.getElementById('modalEstado').value = item.estado || 'Disponible';
            document.getElementById('modalComprador').value = item.comprador || '';
            document.getElementById('modalTelefono').value = item.telefono || '';
            document.getElementById('modalNotas').value = item.notas || '';
            document.getElementById('modalVenta').classList.remove('hidden');
            document.getElementById('modalVenta').classList.add('flex');
        }

        function cerrarModalVenta() {
            document.getElementById('modalVenta').classList.add('hidden');
            document.getElementById('modalVenta').classList.remove('flex');
        }

        function guardarVenta() {
            const numero = document.getElementById('modalNumero').value;
            const estado = document.getElementById('modalEstado').value;
            const comprador = document.getElementById('modalComprador').value;
            const telefono = document.getElementById('modalTelefono').value;
            const notas = document.getElementById('modalNotas').value;
            const fecha = new Date().toLocaleDateString();

            document.getElementById('loader').classList.remove('hidden');
            cerrarModalVenta();

            const url = `${WEB_APP_URL}?action=update&numero=${numero}&estado=${encodeURIComponent(estado)}&comprador=${encodeURIComponent(comprador)}&telefono=${encodeURIComponent(telefono)}&fecha=${encodeURIComponent(fecha)}&notas=${encodeURIComponent(notas)}`;

            fetch(url)
                .then(res => res.json())
                .then(res => {
                    cargarDatos();
                })
                .catch(err => {
                    alert("Error al guardar cambios.");
                    document.getElementById('loader').classList.add('hidden');
                });
        }

        function abrirAdminModal() {
            document.getElementById('adminLogin').classList.remove('hidden');
            document.getElementById('adminPanel').classList.add('hidden');
            document.getElementById('adminPass').value = '';
            document.getElementById('modalAdmin').classList.remove('hidden');
            document.getElementById('modalAdmin').classList.add('flex');
        }

        function cerrarAdminModal() {
            document.getElementById('modalAdmin').classList.add('hidden');
            document.getElementById('modalAdmin').classList.remove('flex');
        }

        function verificarAdmin() {
            const pass = document.getElementById('adminPass').value;
            if(pass === 'admin123') { // Puedes cambiar tu contraseña aquí
                document.getElementById('adminLogin').classList.add('hidden');
                document.getElementById('adminPanel').classList.remove('hidden');
                document.getElementById('confTotal').value = configData.totalNumeros;
                document.getElementById('confPrecio').value = configData.precioIndividual;
                document.getElementById('confPromos').value = JSON.stringify(configData.promociones);
            } else {
                alert("Contraseña incorrecta.");
            }
        }

        function guardarConfiguracion() {
            const total = document.getElementById('confTotal').value;
            const precio = document.getElementById('confPrecio').value;
            const promosJson = document.getElementById('confPromos').value;

            document.getElementById('loader').classList.remove('hidden');
            cerrarAdminModal();

            const url = `${WEB_APP_URL}?action=saveConfig&totalNumeros=${total}&precioIndividual=${precio}&promocionesJson=${encodeURIComponent(promosJson)}`;

            fetch(url)
                .then(res => res.json())
                .then(res => {
                    cargarDatos();
                })
                .catch(err => {
                    alert("Error al guardar configuración.");
                    document.getElementById('loader').classList.add('hidden');
                });
        }
    </script>
</body>
</html>
